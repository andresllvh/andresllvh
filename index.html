<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra High-Performance Particle Engine — Float32Array & Batch Chunking</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050816;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #F8FAFC;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 18px 24px;
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    }
    .hud h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #73F7FF;
      text-transform: uppercase;
    }
    .hud p {
      font-size: 12px;
      color: #94A3B8;
    }
    .hud .info-tag {
      font-size: 11px;
      font-weight: 600;
      color: #10B981;
      background: rgba(16, 185, 129, 0.15);
      padding: 4px 8px;
      border-radius: 4px;
      width: fit-content;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    button {
      background: rgba(115, 247, 255, 0.08);
      border: 1px solid rgba(115, 247, 255, 0.3);
      color: #73F7FF;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    button:hover, button.active {
      background: #73F7FF;
      color: #050816;
      box-shadow: 0 0 16px rgba(115, 247, 255, 0.6);
    }
  </style>
</head>
<body>

  <div class="hud">
    <h1>60 FPS Float32Array Particle Engine</h1>
    <p>Zero bloqueio de thread • Carregamento assíncrono em lotes • Reutilização de Buffers</p>
    <div class="info-tag" id="particle-count">Partículas ativas: 6,400 (60 FPS)</div>
    <div class="controls">
      <button class="active" onclick="switchLogo('glyph')">&lt;/&gt; Code Glyph</button>
      <button onclick="switchLogo('react')">React Atom</button>
      <button onclick="switchLogo('ts')">TypeScript TS</button>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // ─── MOUSE REPULSION ───────────────────────────────────────────
    const mouse = { x: -9999, y: -9999, radius: 110 };
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    window.addEventListener('mouseleave', () => {
      mouse.x = -9999;
      mouse.y = -9999;
    });

    // ─── BINARY MASK OFFSCREEN CACHE ───────────────────────────────
    const maskCache = {};

    function getCachedBinaryMask(type) {
      if (maskCache[type]) return maskCache[type];

      const size = 360;
      const offCanvas = document.createElement('canvas');
      const offCtx = offCanvas.getContext('2d');
      offCanvas.width = size;
      offCanvas.height = size;

      offCtx.fillStyle = '#000000';
      offCtx.fillRect(0, 0, size, size);
      offCtx.fillStyle = '#FFFFFF';
      offCtx.strokeStyle = '#FFFFFF';

      const center = size / 2;

      if (type === 'glyph') {
        offCtx.lineWidth = 36;
        offCtx.lineCap = 'round';
        offCtx.lineJoin = 'round';

        offCtx.beginPath();
        offCtx.moveTo(110, 100);
        offCtx.lineTo(50, 180);
        offCtx.lineTo(110, 260);
        offCtx.stroke();

        offCtx.beginPath();
        offCtx.moveTo(210, 70);
        offCtx.lineTo(165, 290);
        offCtx.stroke();

        offCtx.beginPath();
        offCtx.moveTo(260, 100);
        offCtx.lineTo(320, 180);
        offCtx.lineTo(260, 260);
        offCtx.stroke();

      } else if (type === 'react') {
        offCtx.beginPath();
        offCtx.arc(center, center, 32, 0, Math.PI * 2);
        offCtx.fill();

        offCtx.lineWidth = 32;
        const rx = 135;
        const ry = 48;
        [0, Math.PI / 3, (2 * Math.PI) / 3].forEach(angle => {
          offCtx.save();
          offCtx.translate(center, center);
          offCtx.rotate(angle);
          offCtx.beginPath();
          offCtx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
          offCtx.stroke();
          offCtx.restore();
        });

      } else if (type === 'ts') {
        offCtx.lineWidth = 30;
        offCtx.beginPath();
        offCtx.roundRect(45, 45, 270, 270, 42);
        offCtx.stroke();

        offCtx.lineWidth = 26;
        offCtx.lineCap = 'square';
        offCtx.beginPath();
        offCtx.moveTo(105, 135);
        offCtx.lineTo(190, 135);
        offCtx.moveTo(147, 135);
        offCtx.lineTo(147, 255);
        offCtx.stroke();

        offCtx.lineWidth = 24;
        offCtx.lineCap = 'round';
        offCtx.lineJoin = 'round';
        offCtx.beginPath();
        offCtx.moveTo(270, 135);
        offCtx.lineTo(215, 135);
        offCtx.lineTo(215, 190);
        offCtx.lineTo(270, 190);
        offCtx.lineTo(270, 250);
        offCtx.lineTo(215, 250);
        offCtx.stroke();
      }

      const imgData = offCtx.getImageData(0, 0, size, size);
      const data = imgData.data;

      // Sample grid points
      const tempPoints = [];
      const step = 3;
      for (let y = 0; y < size; y += step) {
        for (let x = 0; x < size; x += step) {
          const idx = (y * size + x) * 4;
          if (data[idx] > 100) {
            tempPoints.push(x - center, y - center);
          }
        }
      }

      // Convert to Float32Array
      const floatArray = new Float32Array(tempPoints);
      maskCache[type] = floatArray;
      return floatArray;
    }

    // ─── HIGH PERFORMANCE TYPED ARRAYS ─────────────────────────────
    const MAX_PARTICLES = 10000;

    // Fixed pre-allocated Float32Array buffers (zero garbage collection)
    const posX = new Float32Array(MAX_PARTICLES);
    const posY = new Float32Array(MAX_PARTICLES);
    const targetX = new Float32Array(MAX_PARTICLES);
    const targetY = new Float32Array(MAX_PARTICLES);
    const velX = new Float32Array(MAX_PARTICLES);
    const velY = new Float32Array(MAX_PARTICLES);
    const particleSize = new Float32Array(MAX_PARTICLES);
    const particleAlpha = new Float32Array(MAX_PARTICLES);
    const particleSeed = new Float32Array(MAX_PARTICLES);

    let activeCount = 0;

    // Initialize base particle properties once
    const sizes = [0.9, 1.1, 1.3, 1.5];
    for (let i = 0; i < MAX_PARTICLES; i++) {
      posX[i] = width / 2;
      posY[i] = height / 2;
      particleSize[i] = sizes[i % sizes.length];
      particleAlpha[i] = 0.75 + (i % 25) * 0.01;
      particleSeed[i] = i * 0.17;
    }

    // Async batch loading (chunks of 400 particles per frame to keep 60 FPS)
    function applyMaskToParticlesChunked(type) {
      const maskData = getCachedBinaryMask(type);
      const numPoints = maskData.length / 2;
      activeCount = numPoints;

      document.getElementById('particle-count').textContent = `Partículas ativas: ${numPoints.toLocaleString()} (60 FPS)`;

      const centerX = width / 2;
      const centerY = height / 2;

      let chunkOffset = 0;
      const chunkSize = 400;

      function processChunk() {
        const end = Math.min(chunkOffset + chunkSize, numPoints);
        for (let i = chunkOffset; i < end; i++) {
          const tx = centerX + maskData[i * 2];
          const ty = centerY + maskData[i * 2 + 1];

          targetX[i] = tx;
          targetY[i] = ty;

          if (posX[i] === width / 2) {
            posX[i] = tx;
            posY[i] = ty;
          }
        }
        chunkOffset = end;
        if (chunkOffset < numPoints) {
          requestAnimationFrame(processChunk);
        }
      }
      processChunk();
    }

    function switchLogo(type) {
      document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      applyMaskToParticlesChunked(type);
    }

    applyMaskToParticlesChunked('glyph');

    // ─── OPTIMIZED 60 FPS RENDER LOOP ──────────────────────────────
    let time = 0;
    function animate() {
      time += 0.012;

      // Dark background
      ctx.fillStyle = '#050816';
      ctx.fillRect(0, 0, width, height);

      // Cyan styling
      ctx.shadowColor = '#73F7FF';
      ctx.shadowBlur = 3;

      const mX = mouse.x;
      const mY = mouse.y;
      const mRad = mouse.radius;

      // Fast loop using Float32Array buffers directly
      for (let i = 0; i < activeCount; i++) {
        const seed = particleSeed[i];

        // Subtlest organic noise micro-oscillation (0.3px to 0.7px max)
        const noiseX = Math.sin(time * 1.2 + seed) * 0.5;
        const noiseY = Math.cos(time * 1.1 + seed * 0.7) * 0.5;

        const tx = targetX[i] + noiseX;
        const ty = targetY[i] + noiseY;

        const px = posX[i];
        const py = posY[i];

        // Mouse repulsion
        const dx = px - mX;
        const dy = py - mY;
        const distSq = dx * dx + dy * dy;

        let repelX = 0, repelY = 0;
        if (distSq < mRad * mRad && distSq > 0) {
          const dist = Math.sqrt(distSq);
          const force = (1 - dist / mRad) * 22;
          repelX = (dx / dist) * force;
          repelY = (dy / dist) * force;
        }

        // Spring movement to target
        let vx = velX[i] + (tx + repelX - px) * 0.08;
        let vy = velY[i] + (ty + repelY - py) * 0.08;
        vx *= 0.78;
        vy *= 0.78;

        velX[i] = vx;
        velY[i] = vy;

        const newX = px + vx;
        const newY = py + vy;
        posX[i] = newX;
        posY[i] = newY;

        // Render
        ctx.fillStyle = `rgba(115, 247, 255, ${particleAlpha[i] * (0.85 + 0.15 * Math.sin(time * 2 + seed))})`;
        ctx.beginPath();
        ctx.arc(newX, newY, particleSize[i], 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
