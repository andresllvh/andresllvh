<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Particle Showcase — Solid Volume Sampling</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050816;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #F8FAFC;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    .hud h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #73F7FF;
      text-transform: uppercase;
    }
    .hud p {
      font-size: 12px;
      color: #94A3B8;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    button {
      background: rgba(115, 247, 255, 0.1);
      border: 1px solid rgba(115, 247, 255, 0.3);
      color: #73F7FF;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover, button.active {
      background: #73F7FF;
      color: #050816;
      box-shadow: 0 0 12px rgba(115, 247, 255, 0.5);
    }
  </style>
</head>
<body>

  <div class="hud">
    <h1>Particle Showcase — Solid Area Sampling</h1>
    <p>5,000 a 10,000 partículas preenchendo o volume interno dos logos.</p>
    <div class="controls">
      <button class="active" onclick="switchLogo('glyph')">&lt;/&gt; Code</button>
      <button onclick="switchLogo('react')">React Atom</button>
      <button onclick="switchLogo('ts')">TypeScript</button>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // ─── MOUSE HOVER REPULSION ─────────────────────────────────────
    const mouse = { x: -9999, y: -9999, radius: 100 };
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    window.addEventListener('mouseleave', () => {
      mouse.x = -9999;
      mouse.y = -9999;
    });

    // ─── OFFSCREEN CANVAS SAMPLING (AREA SAMPLING) ─────────────────
    function generateLogoImageData(type) {
      const offCanvas = document.createElement('canvas');
      const offCtx = offCanvas.getContext('2d');
      const size = 380;
      offCanvas.width = size;
      offCanvas.height = size;
      const center = size / 2;

      offCtx.fillStyle = '#000000';
      offCtx.fillRect(0, 0, size, size);
      offCtx.fillStyle = '#FFFFFF';
      offCtx.strokeStyle = '#FFFFFF';

      if (type === 'glyph') {
        offCtx.lineWidth = 32;
        offCtx.lineCap = 'round';
        offCtx.lineJoin = 'round';

        // '<'
        offCtx.beginPath();
        offCtx.moveTo(110, 110);
        offCtx.lineTo(60, 190);
        offCtx.lineTo(110, 270);
        offCtx.stroke();

        // '/'
        offCtx.beginPath();
        offCtx.moveTo(210, 80);
        offCtx.lineTo(170, 300);
        offCtx.stroke();

        // '>'
        offCtx.beginPath();
        offCtx.moveTo(270, 110);
        offCtx.lineTo(320, 190);
        offCtx.lineTo(270, 270);
        offCtx.stroke();

      } else if (type === 'react') {
        // Center nucleus
        offCtx.beginPath();
        offCtx.arc(center, center, 32, 0, Math.PI * 2);
        offCtx.fill();

        // 3 thick orbits
        offCtx.lineWidth = 30;
        const rx = 130;
        const ry = 48;
        [0, Math.PI / 3, (2 * Math.PI) / 3].forEach(angle => {
          offCtx.save();
          offCtx.translate(center, center);
          offCtx.rotate(angle);
          offCtx.beginPath();
          offCtx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
          offCtx.stroke();
          offCtx.restore();
        });

      } else if (type === 'ts') {
        // Outer rounded box
        offCtx.lineWidth = 26;
        offCtx.beginPath();
        offCtx.roundRect(50, 50, 280, 280, 40);
        offCtx.stroke();

        // 'T'
        offCtx.lineWidth = 22;
        offCtx.beginPath();
        offCtx.moveTo(110, 140);
        offCtx.lineTo(190, 140);
        offCtx.moveTo(150, 140);
        offCtx.lineTo(150, 260);
        offCtx.stroke();

        // 'S'
        offCtx.beginPath();
        offCtx.moveTo(270, 140);
        offCtx.lineTo(220, 140);
        offCtx.lineTo(220, 195);
        offCtx.lineTo(270, 195);
        offCtx.lineTo(270, 250);
        offCtx.lineTo(220, 250);
        offCtx.stroke();
      }

      return offCtx.getImageData(0, 0, size, size);
    }

    // ─── PARTICLE CREATION (AREA SAMPLING) ─────────────────────────
    const NUM_PARTICLES = 6000;
    const particles = [];

    function sampleParticlesFromLogo(type) {
      const imgData = generateLogoImageData(type);
      const data = imgData.data;
      const size = imgData.width;

      const validPixels = [];
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const idx = (y * size + x) * 4;
          if (data[idx] > 50) { // alpha / white threshold
            validPixels.push({ x: x - size / 2, y: y - size / 2 });
          }
        }
      }

      const targets = [];
      for (let i = 0; i < NUM_PARTICLES; i++) {
        const p = validPixels[Math.floor(Math.random() * validPixels.length)];
        targets.push({
          x: width / 2 + p.x + (Math.random() - 0.5) * 0.8,
          y: height / 2 + p.y + (Math.random() - 0.5) * 0.8
        });
      }
      return targets;
    }

    // Initialize particles
    let currentTargets = sampleParticlesFromLogo('glyph');

    for (let i = 0; i < NUM_PARTICLES; i++) {
      const sizes = [0.8, 1.0, 1.3, 1.5];
      particles.push({
        x: width / 2 + (Math.random() - 0.5) * width,
        y: height / 2 + (Math.random() - 0.5) * height,
        targetX: currentTargets[i].x,
        targetY: currentTargets[i].y,
        vx: 0,
        vy: 0,
        size: sizes[Math.floor(Math.random() * sizes.length)],
        alpha: 0.6 + Math.random() * 0.4,
        seed: Math.random() * 1000,
        ease: 0.05 + Math.random() * 0.03
      });
    }

    function switchLogo(type) {
      document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      const newTargets = sampleParticlesFromLogo(type);
      for (let i = 0; i < NUM_PARTICLES; i++) {
        particles[i].targetX = newTargets[i].x;
        particles[i].targetY = newTargets[i].y;
      }
    }

    // ─── RENDER LOOP ───────────────────────────────────────────────
    let time = 0;
    function animate() {
      time += 0.015;

      // Dark background with subtle trail blur
      ctx.fillStyle = '#050816';
      ctx.fillRect(0, 0, width, height);

      // Render glowing particles
      ctx.shadowColor = '#73F7FF';
      ctx.shadowBlur = 4;

      for (let i = 0; i < NUM_PARTICLES; i++) {
        const p = particles[i];

        // 1. Organic noise micro-oscillations (amplitude 0.3 to 1.2px)
        const noiseX = Math.sin(time + p.seed) * 0.8;
        const noiseY = Math.cos(time * 0.9 + p.seed) * 0.8;

        const tx = p.targetX + noiseX;
        const ty = p.targetY + noiseY;

        // 2. Mouse Repulsion
        const dx = p.x - mouse.x;
        const dy = p.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        let repelX = 0, repelY = 0;
        if (dist < mouse.radius && dist > 0) {
          const force = (1 - dist / mouse.radius) * 25;
          repelX = (dx / dist) * force;
          repelY = (dy / dist) * force;
        }

        // 3. Smooth Spring Convergence
        p.vx += (tx + repelX - p.x) * p.ease;
        p.vy += (ty + repelY - p.y) * p.ease;
        p.vx *= 0.82;
        p.vy *= 0.82;

        p.x += p.vx;
        p.y += p.vy;

        // 4. Draw particle
        ctx.fillStyle = `rgba(115, 247, 255, ${p.alpha * (0.8 + 0.2 * Math.sin(time * 2 + p.seed))})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
