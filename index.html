<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Particle Showcase — High Density Binary Mask Grid Sampling</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050816;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #F8FAFC;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 18px 24px;
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    }
    .hud h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #73F7FF;
      text-transform: uppercase;
    }
    .hud p {
      font-size: 12px;
      color: #94A3B8;
    }
    .hud .info-tag {
      font-size: 11px;
      font-weight: 600;
      color: #10B981;
      background: rgba(16, 185, 129, 0.15);
      padding: 4px 8px;
      border-radius: 4px;
      width: fit-content;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    button {
      background: rgba(115, 247, 255, 0.08);
      border: 1px solid rgba(115, 247, 255, 0.3);
      color: #73F7FF;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    button:hover, button.active {
      background: #73F7FF;
      color: #050816;
      box-shadow: 0 0 16px rgba(115, 247, 255, 0.6);
    }
  </style>
</head>
<body>

  <div class="hud">
    <h1>High-Fidelity Binary Mask Grid Sampling</h1>
    <p>Amostragem uniforme direta da máscara binária — 6.000+ partículas sólidas.</p>
    <div class="info-tag" id="particle-count">Partículas ativas: 6,400</div>
    <div class="controls">
      <button class="active" onclick="switchLogo('glyph')">&lt;/&gt; Code Glyph</button>
      <button onclick="switchLogo('react')">React Atom</button>
      <button onclick="switchLogo('ts')">TypeScript TS</button>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // ─── MOUSE HOVER REPULSION ─────────────────────────────────────
    const mouse = { x: -9999, y: -9999, radius: 110 };
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    window.addEventListener('mouseleave', () => {
      mouse.x = -9999;
      mouse.y = -9999;
    });

    // ─── BINARY MASK RENDERER & GRID SAMPLING ─────────────────────
    function sampleGridFromBinaryMask(type) {
      const size = 360;
      const offCanvas = document.createElement('canvas');
      const offCtx = offCanvas.getContext('2d');
      offCanvas.width = size;
      offCanvas.height = size;

      offCtx.fillStyle = '#000000';
      offCtx.fillRect(0, 0, size, size);
      offCtx.fillStyle = '#FFFFFF';
      offCtx.strokeStyle = '#FFFFFF';

      const center = size / 2;

      if (type === 'glyph') {
        offCtx.lineWidth = 36;
        offCtx.lineCap = 'round';
        offCtx.lineJoin = 'round';

        // '<'
        offCtx.beginPath();
        offCtx.moveTo(110, 100);
        offCtx.lineTo(50, 180);
        offCtx.lineTo(110, 260);
        offCtx.stroke();

        // '/'
        offCtx.beginPath();
        offCtx.moveTo(210, 70);
        offCtx.lineTo(165, 290);
        offCtx.stroke();

        // '>'
        offCtx.beginPath();
        offCtx.moveTo(260, 100);
        offCtx.lineTo(320, 180);
        offCtx.lineTo(260, 260);
        offCtx.stroke();

      } else if (type === 'react') {
        // Nucleus
        offCtx.beginPath();
        offCtx.arc(center, center, 32, 0, Math.PI * 2);
        offCtx.fill();

        // 3 orbits
        offCtx.lineWidth = 32;
        const rx = 135;
        const ry = 48;
        [0, Math.PI / 3, (2 * Math.PI) / 3].forEach(angle => {
          offCtx.save();
          offCtx.translate(center, center);
          offCtx.rotate(angle);
          offCtx.beginPath();
          offCtx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
          offCtx.stroke();
          offCtx.restore();
        });

      } else if (type === 'ts') {
        // Outer rounded box
        offCtx.lineWidth = 30;
        offCtx.beginPath();
        offCtx.roundRect(45, 45, 270, 270, 42);
        offCtx.stroke();

        // Bold 'T'
        offCtx.lineWidth = 26;
        offCtx.lineCap = 'square';
        offCtx.beginPath();
        offCtx.moveTo(105, 135);
        offCtx.lineTo(190, 135);
        offCtx.moveTo(147, 135);
        offCtx.lineTo(147, 255);
        offCtx.stroke();

        // Bold 'S'
        offCtx.lineWidth = 24;
        offCtx.lineCap = 'round';
        offCtx.lineJoin = 'round';
        offCtx.beginPath();
        offCtx.moveTo(270, 135);
        offCtx.lineTo(215, 135);
        offCtx.lineTo(215, 190);
        offCtx.lineTo(270, 190);
        offCtx.lineTo(270, 250);
        offCtx.lineTo(215, 250);
        offCtx.stroke();
      }

      const imgData = offCtx.getImageData(0, 0, size, size);
      const data = imgData.data;

      // UNIFORM GRID SAMPLING (step = 3px)
      const points = [];
      const step = 3;
      for (let y = 0; y < size; y += step) {
        for (let x = 0; x < size; x += step) {
          const idx = (y * size + x) * 4;
          if (data[idx] > 100) { // White pixel inside binary mask
            points.push({
              x: width / 2 + (x - center),
              y: height / 2 + (y - center)
            });
          }
        }
      }
      return points;
    }

    // ─── INITIALIZE PARTICLES ──────────────────────────────────────
    let particles = [];
    let currentLogo = 'glyph';

    function initParticles(type) {
      const gridPoints = sampleGridFromBinaryMask(type);
      document.getElementById('particle-count').textContent = `Partículas sólidas: ${gridPoints.length.toLocaleString()}`;

      const sizes = [0.9, 1.1, 1.3, 1.5];

      // Match or adjust particles array
      if (particles.length < gridPoints.length) {
        const diff = gridPoints.length - particles.length;
        for (let i = 0; i < diff; i++) {
          particles.push({
            x: width / 2,
            y: height / 2,
            targetX: width / 2,
            targetY: height / 2,
            vx: 0,
            vy: 0,
            size: sizes[Math.floor(Math.random() * sizes.length)],
            alpha: 0.7 + Math.random() * 0.3,
            seed: Math.random() * 1000
          });
        }
      }

      // Assign grid targets exactly
      for (let i = 0; i < gridPoints.length; i++) {
        particles[i].targetX = gridPoints[i].x;
        particles[i].targetY = gridPoints[i].y;
        if (particles[i].x === width / 2) {
          particles[i].x = gridPoints[i].x;
          particles[i].y = gridPoints[i].y;
        }
      }

      // Trim excess if any
      particles = particles.slice(0, gridPoints.length);
    }

    function switchLogo(type) {
      document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      currentLogo = type;
      initParticles(type);
    }

    initParticles('glyph');

    // ─── RENDER LOOP ───────────────────────────────────────────────
    let time = 0;
    function animate() {
      time += 0.012;

      // Dark background
      ctx.fillStyle = '#050816';
      ctx.fillRect(0, 0, width, height);

      // Radial cyan glow under logo
      const glowGrad = ctx.createRadialGradient(width/2, height/2, 20, width/2, height/2, 250);
      glowGrad.addColorStop(0, 'rgba(115, 247, 255, 0.08)');
      glowGrad.addColorStop(1, 'rgba(5, 8, 22, 0)');
      ctx.fillStyle = glowGrad;
      ctx.fillRect(0, 0, width, height);

      // Cyan particle styling
      ctx.shadowColor = '#73F7FF';
      ctx.shadowBlur = 3;

      const len = particles.length;
      for (let i = 0; i < len; i++) {
        const p = particles[i];

        // Subtlest organic noise micro-oscillation (0.3px to 0.7px max amplitude)
        const noiseX = Math.sin(time * 1.2 + p.seed) * 0.5;
        const noiseY = Math.cos(time * 1.1 + p.seed * 0.7) * 0.5;

        const tx = p.targetX + noiseX;
        const ty = p.targetY + noiseY;

        // Mouse Repulsion
        const dx = p.x - mouse.x;
        const dy = p.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        let repelX = 0, repelY = 0;
        if (dist < mouse.radius && dist > 0) {
          const force = (1 - dist / mouse.radius) * 22;
          repelX = (dx / dist) * force;
          repelY = (dy / dist) * force;
        }

        // Smooth spring movement to grid position
        p.vx += (tx + repelX - p.x) * 0.08;
        p.vy += (ty + repelY - p.y) * 0.08;
        p.vx *= 0.78;
        p.vy *= 0.78;

        p.x += p.vx;
        p.y += p.vy;

        // Render particle
        ctx.fillStyle = `rgba(115, 247, 255, ${p.alpha * (0.85 + 0.15 * Math.sin(time * 2 + p.seed))})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
